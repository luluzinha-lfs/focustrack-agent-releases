name: Publish FocusTrack Ponto 0.4.1

on:
  push:
    branches:
      - "release/ponto-0.4.1-public"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public releases repo
        uses: actions/checkout@v4

      - name: Download validated private CI artifact
        env:
          SOURCE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c3f8-820e-acfb-c7006e706059/raw?se=2026-10-01T19%3A43%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=a8c30a35-5772-5937-98c6-cf7291d40dc9&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T13%3A15%3A07Z&ske=2026-10-02T13%3A15%3A07Z&sks=b&skv=2026-02-06&sig=SbftF3%2BHLM2inqdmm1/YMGpEJfe84a6ORzDr4xBg31Y%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_URL" -o FocusTrackPonto-windows-0.4.1.zip

      - name: Validate provenance and package contract
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir verify
          unzip -q FocusTrackPonto-windows-0.4.1.zip -d verify

          test -f verify/FocusTrackPonto.exe
          test -f verify/FocusTrackPonto-Setup.cmd
          test -f verify/Install-FocusTrackPontoStandalone.ps1
          test -f verify/Read-FocusTrackPontoManifest.ps1
          test -f verify/manifest.json

          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("verify")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8-sig"))
          assert manifest["product"] == "FocusTrack Ponto"
          assert manifest["version"] == "0.4.1"
          assert manifest["source_commit"] == "0839811a13b3823a800007635f2257b892131a5a"
          assert manifest["autostart"] is False
          assert manifest["offline_punch"] is False
          exe = root / "FocusTrackPonto.exe"
          digest = hashlib.sha256(exe.read_bytes()).hexdigest().upper()
          assert digest == "0F19FE3C06C83B62C83CFCFCAB98A11A11E74842FC2419EBE5B42D94BD897BB5"
          assert digest == manifest["sha256"].upper()
          print("PONTO_PUBLIC_PROMOTION_PROVENANCE=PASS")
          PY

      - name: Build public checksums and notes
        run: |
          set -euo pipefail
          ZIP_SHA="$(sha256sum FocusTrackPonto-windows-0.4.1.zip | awk '{print $1}')"
          EXE_SHA="0f19fe3c06c83b62c83cfcfcab98a11a11e74842fc2419ebe5b42d94bd897bb5"
          printf "%s  FocusTrackPonto-windows-0.4.1.zip\n%s  FocusTrackPonto.exe\n" "$ZIP_SHA" "$EXE_SHA" > SHA256SUMS.txt
          cat > RELEASE_NOTES_0.4.1.md <<'EOF'
          # FocusTrack Ponto 0.4.1

          Pacote público de distribuição do FocusTrack Ponto para Windows.

          - Ativação por token de uso único.
          - Credencial própria do Ponto protegida pelo Windows DPAPI.
          - Instalação standalone por usuário.
          - Sem autostart.
          - Sem marcação offline.
          - Não converte heartbeat, foco, presença ou atividade do computador em ponto.
          - Timestamp e transições permanecem confirmados pelo backend FocusTrack.

          Proveniência:
          - Source commit privado validado: `0839811a13b3823a800007635f2257b892131a5a`
          - SHA256 FocusTrackPonto.exe: `0f19fe3c06c83b62c83cfcfcab98a11a11e74842fc2419ebe5b42d94bd897bb5`
          EOF

      - name: Publish public immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ponto-windows-0.4.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG"             FocusTrackPonto-windows-0.4.1.zip             SHA256SUMS.txt             RELEASE_NOTES_0.4.1.md             --target "$GITHUB_SHA"             --title "FocusTrack Ponto Windows 0.4.1"             --notes-file RELEASE_NOTES_0.4.1.md
